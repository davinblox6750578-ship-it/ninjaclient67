name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          unzip -oq ninjaclient-atualizado.zip
          cat > ninjaclient/settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }
          rootProject.name = 'ninjaclient'
          EOF

      - name: Remover Keystraks+
        working-directory: ninjaclient
        run: |
          sed -i '/^\/\/ Keystraks+/,$d' build.gradle
          cat > src/main/resources/fabric.mod.json << 'EOF'
          {
            "schemaVersion": 1,
            "id": "ninjaclient",
            "version": "${version}",
            "name": "NinjaClient",
            "environment": "client",
            "accessWidener": "ninjaclient.accesswidener",
            "mixins": ["ninjaclient.mixins.json"],
            "entrypoints": { "client": ["com.meuclient.MeuClient"] },
            "depends": {
              "fabricloader": ">=0.18.0",
              "minecraft": "~1.21.11",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

      - name: Corrigir nomes renomeados no 1.21.11
        working-directory: ninjaclient/src/main/java/com/meuclient
        run: |
          sed -i 's/\bcam\.getPos()/cam.getCameraPos()/g' $(grep -rl 'cam.getPos' .)
          sed -i 's/\btarget\.getPos()/target.getEntityPos()/g' $(grep -rl 'target.getPos' .)
          sed -i 's/\bgolem\.getPos()/golem.getEntityPos()/g' $(grep -rl 'golem.getPos' .)
          sed -i 's/\bp\.getPos()/p.getEntityPos()/g' PlayerTracker.java
          sed -i 's/\bisFallFlying()/isGliding()/g' $(grep -rl 'isFallFlying' .)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ninjaclient
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ninjaclient-jar
          path: ninjaclient/build/libs/*.jar
